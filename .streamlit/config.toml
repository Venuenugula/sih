[theme]
base = "dark"
primaryColor = "#1F9D8A"
backgroundColor = "#0A0D10"
secondaryBackgroundColor = "#12171C"
textColor = "#E8EEF4"
font = "sans serif"

[browser]
gatherUsageStats = false

[server]
headless = true
# For production/LAN deploy, override via CLI: --server.address=0.0.0.0
address = "0.0.0.0"
port = 8501
enableCORS = false
enableXsrfProtection = true
